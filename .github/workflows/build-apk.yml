name: Build INGCO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Create Android project
        run: |
          cordova create android-app com.ingco.catalog INGCO

      - name: Extract HTML
        run: |
          rm -rf catalog
          mkdir -p catalog

          unzip -o index.zip -d catalog

          if [ ! -f "catalog/index.html" ]; then
            echo "ERROR: index.html not found inside index.zip"
            unzip -l index.zip
            exit 1
          fi

      - name: Put V25 into app
        run: |
          rm -rf android-app/www/*
          cp catalog/index.html android-app/www/index.html

      - name: Configure Android app
        run: |
          cp app_icon.png android-app/icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/config.xml")
          s = p.read_text()

          # App icon
          if '<icon src="icon.png"' not in s:
              s = s.replace(
                  "</widget>",
                  '    <icon src="icon.png" />\n</widget>"
              )

          # Internet / external resources
          if '<access origin="*"' not in s:
              s = s.replace(
                  "</widget>",
                  '    <access origin="*" />\n</widget>"
              )

          # Allow navigation
          if '<allow-navigation href="*"' not in s:
              s = s.replace(
                  "</widget>",
                  '    <allow-navigation href="*" />\n</widget>"
              )

          # Camera permission
          if 'android.permission.CAMERA' not in s:
              s = s.replace(
                  "</widget>",
                  '''    <edit-config
                      file="app/src/main/AndroidManifest.xml"
                      mode="merge"
                      target="/manifest">
                      <uses-permission android:name="android.permission.CAMERA" />
                  </edit-config>
          </widget>'''
              )

          p.write_text(s)
          PY

      - name: Add Android platform
        working-directory: android-app
        run: |
          cordova platform add android@15.1.0 --no-interactive

      - name: Build APK
        working-directory: android-app
        run: |
          cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INGCO-V25-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
