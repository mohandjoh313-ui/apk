name: Build INGCO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Create Android project
        run: cordova create android-app com.ingco.catalog INGCO

      - name: Extract V25
        run: |
          mkdir -p catalog
          unzip -o index.zip -d catalog

          test -f catalog/index.html

      - name: Put V25 into app
        run: |
          rm -rf android-app/www/*
          cp catalog/index.html android-app/www/index.html

      - name: Configure app
        run: |
          cp app_icon.png android-app/icon.png

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/config.xml")
          s = p.read_text()

          s = s.replace(
              "</widget>",
              '    <icon src="icon.png" />\n'
              '    <access origin="*" />\n'
              '    <allow-navigation href="*" />\n'
              "</widget>"
          )

          p.write_text(s)
          PY

      - name: Add Android
        working-directory: android-app
        run: |
          cordova platform add android@15.1.0 --no-interactive

      - name: Add camera permission
        working-directory: android-app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("platforms/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.CAMERA" />'

          if permission not in s:
              s = s.replace(
                  "<application",
                  permission + "\n    <application"
              )

          p.write_text(s)
          PY

      - name: Build APK
        working-directory: android-app
        run: |
          cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INGCO-V25-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
