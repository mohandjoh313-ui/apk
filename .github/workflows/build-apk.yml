name: Build INGCO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova@12.0.0

      - name: Create Android project
        run: |
          cordova create android-app com.ingco.catalog INGCO

      - name: Put HTML into app
        run: |
          rm -rf android-app/www/*
          cp index.html android-app/www/index.html

      - name: Add app icon
        run: |
          cp app_icon.png android-app/icon.png
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android-app/config.xml")
          s = p.read_text()

          s = s.replace(
              "</widget>",
              '    <icon src="icon.png" />\n</widget>'
          )

          p.write_text(s)
          PY

      - name: Add Android platform
        working-directory: android-app
        run: cordova platform add android@13.0.0 --no-interactive

      - name: Build APK
        working-directory: android-app
        run: cordova build android --debug --no-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INGCO-V25-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
